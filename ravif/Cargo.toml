[package]
name = "zenravif"
description = "Pure Rust AVIF encoder wrapping zenrav1e with still image, animation, HDR, and metadata support"
version = "0.2.0"
authors = ["Kornel Lesiński <kornel@geekhood.net>", "Lilith River <lilith@imazen.io>"]
edition = "2024"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
readme = "README.md"
keywords = ["avif", "encoder", "av1", "image", "animation"]
categories = ["multimedia::images", "multimedia::encoding"]
homepage = "https://lib.rs/crates/zenravif"
repository = "https://github.com/imazen/cavif-rs"
include = ["README.md", "CHANGELOG.md", "LICENSE-AGPL3", "LICENSE-COMMERCIAL", "Cargo.toml", "/src/*.rs", "/examples/*.rs"]
rust-version = "1.93"

[dependencies]
# zenavif-serialize 0.2.0 (set_gain_map_alt_icc — the tmap ICC alternate colr)
# is unpublished (crates.io tops out at 0.1.4). Git-rev pinned on the dep line
# rather than supplied by a root [patch.crates-io] (as it was until 2026-08-27):
# a [patch] only applies from the top-level workspace, so every git consumer
# of zenravif (zenavif main → zencodecs/zenpipe, and their sibling-clone CI)
# had to re-supply it themselves — and zenpipe's CI could not. The rev is the
# archived standalone repo's last commit (the crate now lives as a member of
# the imazen/zenavif workspace at the same version); it is deliberately NOT
# the zenavif workspace repo, whose corpus submodules cargo would fetch
# (~600 MB) on every cavif-rs CI job. Return to a registry dep at the 0.2.0
# publish.
zenavif-serialize = { version = "0.2.0", git = "https://github.com/imazen/zenavif-serialize", rev = "990bd6d025ece47da74cbd74c245302bd45bbf8e" }
imgref = "1.12.0"
# zenrav1e master (0.2.0, unpublished — crates.io tops out at 0.1.4) rather
# than the registry, because 0.1.4 has no `FrameHints` /
# `FrameParameters.frame_hints` — the sole reason `FRAME_HINTS_LIVE` was
# hard-false, which made supplied per-SB diffmap maps accepted-then-discarded.
# A [patch.crates-io] CANNOT do this: it only substitutes a package whose
# version satisfies the existing requirement, and 0.2.0 does not satisfy "0.1.4".
#
# Git-rev pinned (not a `path` to the sibling checkout, which it was until
# 2026-08-27): a path-only dep is unresolvable for anyone taking zenravif from
# git (zenavif main -> zencodecs/zenpipe), because the path escapes this repo.
# The same shape as the rav1d-safe / zenavif-serialize pins in the root
# manifest. For sibling-lockstep development, add an uncommitted
# `[patch."https://github.com/imazen/zenrav1e"] zenrav1e = { path = "../zenrav1e" }`
# at the workspace root (or `cargo superwork patch`); bump `rev` here when
# a zenrav1e master change is needed. Both the wasm32 dep below and this one
# must stay on the same rev.
#
# NOT a diffmap-only change vs 0.1.4: master carries default-ON
# partition/split-cost RD fixes, so encoded BYTES move vs 0.1.4 across the
# board. Anything fitted against 0.1.4 must be re-measured. Return to a
# registry dep at the release past 0.1.4.
zenrav1e = { version = "0.2.0", git = "https://github.com/imazen/zenrav1e", rev = "e4883037553434efb57ecbf4414c8b49922ba3e4", default-features = false }
rayon = { version = "1.11.0", optional = true }
rgb = { version = "0.8", default-features = false }
loop9 = "0.1.5"
quick-error = "2.0.1"
whereat = "0.1.5"
almost-enough = { version = "0.4.3", optional = true, default-features = false, features = ["alloc"] }

[target.'cfg(target = "wasm32-unknown-unknown")'.dependencies]
zenrav1e = { version = "0.2.0", git = "https://github.com/imazen/zenrav1e", rev = "e4883037553434efb57ecbf4414c8b49922ba3e4", default-features = false, features = ["wasm"] }

[features]
default = ["asm", "threading"]
asm = ["zenrav1e/asm"]
threading = ["dep:rayon", "zenrav1e/threading"]
stop = ["zenrav1e/stop", "dep:almost-enough"]
imazen = []
# Expert / unstable: exposes `expert::InternalParams` for codec
# calibration sweeps + the rav1e knob predictor MLP training pipeline.
# Double-underscore prefix signals "private — do not depend on this in
# production code." Anything in `expert` may change without semver bumps.
# Implies `imazen` because the underlying speed-preset overrides
# (CDEF / RDO / segmentation / partition_range / etc.) live behind that
# feature gate.
__expert = ["imazen"]

[dev-dependencies]
avif-parse = "2.0.0"
zenavif-parse = "0.5.2"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--generate-link-to-definition"]

[package.metadata.superwork.ci]
strategy = "strip_path"
