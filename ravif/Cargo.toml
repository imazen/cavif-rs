[package]
name = "zenravif"
description = "Pure Rust AVIF encoder wrapping zenrav1e with still image, animation, HDR, and metadata support"
version = "0.2.0"
authors = ["Kornel Lesiński <kornel@geekhood.net>", "Lilith River <lilith@imazen.io>"]
edition = "2024"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
readme = "README.md"
keywords = ["avif", "encoder", "av1", "image", "animation"]
categories = ["multimedia::images", "multimedia::encoding"]
homepage = "https://lib.rs/crates/zenravif"
repository = "https://github.com/imazen/cavif-rs"
include = ["README.md", "CHANGELOG.md", "LICENSE-AGPL3", "LICENSE-COMMERCIAL", "Cargo.toml", "/src/*.rs", "/examples/*.rs"]
rust-version = "1.93"

[dependencies]
zenavif-serialize = { version = "0.2.0" }  # set_gain_map_alt_icc; supplied by [patch.crates-io] until 0.2.0 publishes
imgref = "1.12.0"
# DEV: sibling checkout (master, 0.2.0) rather than registry 0.1.4, because
# 0.1.4 has no `FrameHints` / `FrameParameters.frame_hints` — the sole reason
# `FRAME_HINTS_LIVE` was hard-false, which made supplied per-SB diffmap maps
# accepted-then-discarded. A [patch.crates-io] CANNOT do this: it only
# substitutes a package whose version satisfies the existing requirement, and
# 0.2.0 does not satisfy "0.1.4".
#
# NOT a diffmap-only change: master carries default-ON partition/split-cost RD
# fixes, so encoded BYTES move vs 0.1.4 across the board. Anything fitted
# against 0.1.4 must be re-measured. Return to a registry dep at the release
# past 0.1.4.
zenrav1e = { path = "../../zenrav1e", default-features = false }
rayon = { version = "1.11.0", optional = true }
rgb = { version = "0.8", default-features = false }
loop9 = "0.1.5"
quick-error = "2.0.1"
whereat = "0.1.5"
almost-enough = { version = "0.4.3", optional = true, default-features = false, features = ["alloc"] }

[target.'cfg(target = "wasm32-unknown-unknown")'.dependencies]
zenrav1e = { path = "../../zenrav1e", default-features = false, features = ["wasm"] }

[features]
default = ["asm", "threading"]
asm = ["zenrav1e/asm"]
threading = ["dep:rayon", "zenrav1e/threading"]
stop = ["zenrav1e/stop", "dep:almost-enough"]
imazen = []
# Expert / unstable: exposes `expert::InternalParams` for codec
# calibration sweeps + the rav1e knob predictor MLP training pipeline.
# Double-underscore prefix signals "private — do not depend on this in
# production code." Anything in `expert` may change without semver bumps.
# Implies `imazen` because the underlying speed-preset overrides
# (CDEF / RDO / segmentation / partition_range / etc.) live behind that
# feature gate.
__expert = ["imazen"]

[dev-dependencies]
avif-parse = "2.0.0"
zenavif-parse = "0.5.2"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--generate-link-to-definition"]

[package.metadata.superwork.ci]
strategy = "strip_path"
