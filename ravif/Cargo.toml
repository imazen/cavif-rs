[package]
name = "zenravif"
description = "Pure Rust AVIF encoder wrapping zenrav1e with still image, animation, HDR, and metadata support"
version = "0.1.0"
authors = ["Kornel Lesiński <kornel@geekhood.net>", "Lilith River <lilith@imazen.io>"]
edition = "2024"
license = "BSD-3-Clause"
readme = "README.md"
keywords = ["avif", "encoder", "av1", "image", "animation"]
categories = ["multimedia::images", "multimedia::encoding"]
homepage = "https://lib.rs/crates/zenravif"
repository = "https://github.com/imazen/cavif-rs"
include = ["README.md", "LICENSE", "Cargo.toml", "/src/*.rs", "/examples/*.rs"]
rust-version = "1.93"

[dependencies]
zenavif-serialize = { version = "0.1", path = "../../zenavif-serialize" }
imgref = "1.12.0"
zenrav1e = { version = "0.1", path = "../../zenrav1e", default-features = false }
rayon = { version = "1.11.0", optional = true }
rgb = { version = "0.8", default-features = false }
loop9 = "0.1.5"
quick-error = "2.0.1"
almost-enough = { version = "0.4.2", optional = true, default-features = false, features = ["alloc"] }

[target.'cfg(target = "wasm32-unknown-unknown")'.dependencies]
zenrav1e = { version = "0.1", path = "../../zenrav1e", default-features = false, features = ["wasm"] }

[features]
default = ["asm", "threading"]
asm = ["zenrav1e/asm"]
threading = ["dep:rayon", "zenrav1e/threading"]
stop = ["zenrav1e/stop", "dep:almost-enough"]
imazen = []

[dev-dependencies]
avif-parse = "2.0.0"
zenavif-parse = { version = "0.5.0", path = "../../zenavif-parse" }
