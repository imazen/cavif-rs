[package]
name = "ravif"
description = "rav1e-based pure Rust library for encoding images in AVIF format (powers the `cavif` tool)"
version = "0.14.0"
authors = ["Kornel Lesiński <kornel@geekhood.net>"]
edition = "2024"
license = "BSD-3-Clause"
readme = "README.md"
keywords = ["avif", "convert", "av1", "rav1f", "cav1f"]
categories = ["multimedia::images", "multimedia::encoding"]
homepage = "https://lib.rs/crates/ravif"
repository = "https://github.com/kornelski/cavif-rs"
include = ["README.md", "LICENSE", "Cargo.toml", "/src/*.rs"]
rust-version = "1.85"

[dependencies]
zenavif-serialize = { path = "/home/lilith/work/zenavif-serialize" }
imgref = "1.12.0"
zenrav1e = { path = "/home/lilith/work/zenrav1e", default-features = false }
rayon = { version = "1.11.0", optional = true }
rgb = { version = "0.8", default-features = false }
loop9 = "0.1.5"
quick-error = "2.0.1"

[target.'cfg(target = "wasm32-unknown-unknown")'.dependencies]
zenrav1e = { path = "/home/lilith/work/zenrav1e", default-features = false, features = ["wasm"] }

[features]
default = ["asm", "threading"]
asm = ["zenrav1e/asm"]
threading = ["dep:rayon", "zenrav1e/threading"]
imazen = []

[profile.release]
lto = true

[profile.dev.package."*"]
debug = false
opt-level = 2

[dev-dependencies]
avif-parse = "1.4.0"
zenavif-parse = { path = "/home/lilith/work/zenavif-parse" }

[package.metadata.release]
tag = false
