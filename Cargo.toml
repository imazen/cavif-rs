[package]
name = "cavif"
publish = false
description = "Encodes images in AVIF format (image2avif converter) using a pure-Rust encoder."
version = "1.7.0"
authors = ["Kornel Lesiński <kornel@geekhood.net>"]
edition = "2024"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
readme = "README.md"
keywords = ["avif", "png2avif", "jpeg2avif", "convert", "av1"]
categories = ["command-line-utilities", "multimedia::images", "multimedia::encoding"]
homepage = "https://lib.rs/crates/cavif"
repository = "https://github.com/kornelski/cavif-rs"
include = ["README.md", "LICENSE", "/src/*.rs"]
rust-version = "1.89"

[dependencies]
clap = { version = "4.5.40", default-features = false, features = ["color", "suggestions", "wrap_help", "std", "cargo"] }
cocoa_image = { version = "1.1.0", optional = true }
imgref = "1.12"
load_image = "3.2.1"
zenravif = { version = "0.2.0", path = "ravif", default-features = false, features = ["threading"] }
rayon = "1.11.0"
rgb = { version = "0.8.52", default-features = false }

[features]
default = ["asm", "static"]
asm = ["zenravif/asm"]
static = ["load_image/lcms2-static"]

[profile.dev]
opt-level = 1
debug = 1

[profile.release]
opt-level = 3
panic = "abort"
debug = false
lto = true
strip = true

[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
avif-parse = "2.0.0"
# `examples/gate_sweep.rs` (the release-gate A/B harness) and
# `examples/hdr_pq10_probe.rs` (the 10-bit PQ round-trip probe): both decode the
# encoder's own output and score it, so a gate flip's effect on bytes AND
# quality is measured rather than asserted. cavif is publish = false, so these
# never reach a registry package.
# Pinned git rev (0.6.0 staging), not registry 0.5.7: 0.5.7's aarch64 NEON
# self-guided loop-restoration path panics with an out-of-bounds index while
# decoding our own low-quality (LRF-on) encodes — measured here, see
# benchmarks/gate_flip_summary_2026-08-06.tsv.meta. A git rev rather than the
# sibling path so CI (which checks out this repo alone) can still resolve it.
#
# 2026-08-29, a6a7e232 -> 66f58fa6 (374 commits): aligns this pin with the rev
# zenavif settled on, so the workspace decodes AVIF through one rav1d-safe.
# What the range means for the two examples above, measured (not assumed) —
# benchmarks/rav1d_pin_66f58fa6_2026-08-29.tsv{.zst,.meta}:
#  * rav1d-safe@3426ebf7 (rav1d-safe#524) — an intermittent DisjointMut overlap
#    panic in the 8bpc x86_64 loop-filter H kernels, whose window was sized from
#    the plane's worst case instead of the run's mask and so ran one column past
#    the end of an unpadded picture row. A decoder crash, never wrong pixels.
#    Both kernels now load only the bytes they consume, which is bit-identical
#    by construction (the dropped lanes were read and discarded), and the
#    SIMD-vs-scalar fallback predicate is unchanged, so the decision — and every
#    output byte — is the same. x86_64-only: this repo's CI never compiles
#    rav1d-safe (every job is `-p zenravif`), so that leg is untested here by
#    construction, and the aarch64 evidence below cannot reach it.
#  * rav1d-safe@2e0f7e8 — `Settings::strictness`, now defaulting to
#    `Strictness::Strict`. Both examples build their decoder from
#    `Settings::default()`, so both now reject what libaom rejects
#    (dav1d's strict_std_compliance checks plus the AV1 6.10.8 segment_id bound)
#    as `Error::InvalidData` rather than concealing it. `Settings` is
#    `#[non_exhaustive]`, so this is a behaviour change, not an API break.
#    Measured on 1200 cells of zenravif's OWN output — 5 content classes and
#    q 5..100 step 5 throughout, in three blocks (64/256/1024/2048 at speed 10;
#    64/256 at speeds 4,6,8; 64 at speeds 1,2), 1099 distinct encoded streams:
#    0 newly-rejected streams — 1200 accepted before, 1200 accepted after, no
#    DECFAIL on either side — and every `bytes`/`bpp`/`sha256` column identical,
#    so the encoder output the harness scores is untouched. Strict is the right
#    default here precisely BECAUSE the corpus is our own encoder's output: a
#    stream zenravif emits that libaom would reject is a zenravif bug these
#    harnesses should surface, not conceal. (`Strictness::Lenient` is the
#    opt-out if a future harness ever needs to score deliberately-corrupt
#    input; nothing here does.)
#  * rav1d-safe@59eb17b — `Decoder::flush()` drains owed frames before it
#    resets. Neither example calls it (each decodes one still from
#    `primary_item` in a single `decode()`), and the `ctx.flush()` calls in
#    `ravif/src/{animated,av1encoder}.rs` are zenrav1e's ENCODER context, an
#    unrelated method. No effect on this repo.
#
# The `ssim2` column DOES move, and that is the point of the bump on this
# machine class. 699 of the 1200 cells score differently (mean |delta| 0.039,
# max 0.61, 402 up / 297 down — a rounding-shaped change, not a quality
# trend). Bisected on the 400-cell grid A: a6a7e232 -> 140f9145 moves 339/400
# cells; 140f9145 -> 66f58fa6 moves 0/400. So the movement is entirely the
# aarch64 NEON conformance campaign of 2026-08-07/08, which this repo had not
# yet taken and which zenavif/zenmetrics absorbed on 2026-08-11:
#   rav1d-safe@ef01e85 (itx: the 16x16 per-type eob thresholds and the
#   16x32/32x16 rect2 roundings, +293 vectors), @ddbe8ba (mc: one PREP_BIAS
#   convention at 16bpc and the hardcoded intermediate_bits, +91), and the
#   8bpc compound kernels (+80). Upstream's set-diff-by-name record
#   (rav1d-safe benchmarks/aarch64_md5_fixes_2026-08-07.meta) is
#   302 PASS / 464 MISMATCH before, 766 PASS / 0 MISMATCH after, against
#   dav1d's published MD5s, with 0 newly-failing at every step.
# a6a7e232 is therefore the WRONG side on aarch64: it decoded 464 of 766
# dav1d conformance vectors to the wrong pixels. The old numbers in
# benchmarks/gate_flip_summary_2026-08-06.tsv.meta were scored through that
# decoder on aarch64 hosts and should not be compared against post-bump runs
# cell-for-cell; re-measure a baseline on this pin before the next gate flip.
# That record now carries the notice as a banner at the top of its own .meta
# (and a pointer .meta beside the compressed cells file), naming the five
# invalid columns: `ssim2` plus the four that are computed OVER the ssim2 axis
# — `bd_rate_pct` and `bytes_ratio_at_ssim2_{30,50,70,90}`. Its bytes/bpp/
# sha256 columns, its byte-liveness and encode-cost tables, and its 10-bit HDR
# tail are unaffected and measured so, not assumed.
# Whether x86_64 moves across the same range was NOT measured here — this host
# is aarch64 and cannot run those kernels. What is on the record: the campaign's
# arithmetic fixes are in `_arm` kernels plus a few dispatcher lines
# (`src/itx.rs`, `src/mc.rs`), its baseline of 302/766 is explicitly the aarch64
# one, and rav1d-safe@04fafc2 — inside this range — measured x86_64 at
# 766 PASS / 0 MISMATCH with the set-diff on (name, status, actual_md5) empty
# across x86 t=1, x86 t=8, aarch64 t=1 and aarch64 t=8, i.e. identical pixels on
# both architectures at the END of the range. That makes an x86_64 shift
# unlikely, but it is an inference from upstream's records, not a measurement
# taken here. Treat the ssim2 movement described here as an aarch64 result.
rav1d-safe = { git = "https://github.com/imazen/rav1d-safe", rev = "66f58fa6a64c689998721cc5cdb16a4698e26eec", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
fast-ssim2 = { version = "0.8.2", features = ["imgref"] }
zenresize = { version = "0.3.1", default-features = false, features = ["std"] }

[badges]
maintenance = { status = "actively-developed" }

[workspace]
members = ["ravif"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--generate-link-to-definition"]

# (The former [patch.crates-io] zenavif-serialize git pin moved onto the dep
# line in ravif/Cargo.toml on 2026-08-27 so git consumers of zenravif resolve
# without re-supplying it; a [patch] here would now be unused.)
