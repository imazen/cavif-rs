name: CI

on:
  push:
    branches: [main, master, cooperative]
  pull_request:
    branches: [main, master, cooperative]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: true
  RUST_BACKTRACE: 1
  # Pure Rust flags for zenravif (no asm, no C deps)
  PURE_RUST: "--no-default-features --features threading"

jobs:
  # ==========================================================================
  # Pure Rust testing (no asm, no lcms2)
  # Tests zenravif library only — cavif binary needs lcms2 + nasm
  # ==========================================================================
  test-pure:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: Linux x64 }
          - { os: ubuntu-24.04-arm, name: Linux aarch64 }
          - { os: macos-latest, name: macOS arm64 }
          - { os: macos-26-intel, name: macOS x64 }
          - { os: windows-latest, name: Windows x64 }
          - { os: windows-11-arm, name: Windows arm64 }
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Patch path deps for CI
        shell: bash
        run: |
          sed -E \
            -e 's|, path = "\.\./\.\./[^"]*"||g' \
            -e 's|path = "\.\./\.\./[^"]*", ||g' \
            ravif/Cargo.toml > ravif/Cargo.toml.ci && mv ravif/Cargo.toml.ci ravif/Cargo.toml

      - name: Test zenravif (pure Rust)
        run: cargo test -p zenravif ${{ env.PURE_RUST }}

  # ==========================================================================
  # asm testing (requires NASM) — x86_64 only
  # ==========================================================================
  test-asm:
    name: Test asm (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: Linux x64 }
          - { os: windows-latest, name: Windows x64 }
    steps:
      - uses: actions/checkout@v6
      - uses: ilammy/setup-nasm@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Patch path deps for CI
        shell: bash
        run: |
          sed -E \
            -e 's|, path = "\.\./\.\./[^"]*"||g' \
            -e 's|path = "\.\./\.\./[^"]*", ||g' \
            ravif/Cargo.toml > ravif/Cargo.toml.ci && mv ravif/Cargo.toml.ci ravif/Cargo.toml

      - name: Test zenravif (with asm + threading)
        run: cargo test -p zenravif

  # ==========================================================================
  # Cross-compiled 32-bit testing (i686 via QEMU, pure Rust only)
  # ==========================================================================
  i686:
    name: Test (i686)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - uses: taiki-e/install-action@cross
      - uses: Swatinem/rust-cache@v2
        with:
          key: cross-i686

      - name: Patch path deps for CI
        shell: bash
        run: |
          sed -E \
            -e 's|, path = "\.\./\.\./[^"]*"||g' \
            -e 's|path = "\.\./\.\./[^"]*", ||g' \
            ravif/Cargo.toml > ravif/Cargo.toml.ci && mv ravif/Cargo.toml.ci ravif/Cargo.toml

      - name: Test zenravif (i686/QEMU, pure Rust)
        run: cross test -p zenravif ${{ env.PURE_RUST }} --target i686-unknown-linux-gnu

  # ==========================================================================
  # Clippy
  # ==========================================================================
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Patch path deps for CI
        shell: bash
        run: |
          sed -E \
            -e 's|, path = "\.\./\.\./[^"]*"||g' \
            -e 's|path = "\.\./\.\./[^"]*", ||g' \
            ravif/Cargo.toml > ravif/Cargo.toml.ci && mv ravif/Cargo.toml.ci ravif/Cargo.toml

      - name: Clippy zenravif (pure Rust)
        run: cargo clippy -p zenravif ${{ env.PURE_RUST }} --all-targets -- -D warnings

  # ==========================================================================
  # Format check
  # ==========================================================================
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Patch path deps for CI
        shell: bash
        run: |
          sed -E \
            -e 's|, path = "\.\./\.\./[^"]*"||g' \
            -e 's|path = "\.\./\.\./[^"]*", ||g' \
            ravif/Cargo.toml > ravif/Cargo.toml.ci && mv ravif/Cargo.toml.ci ravif/Cargo.toml

      - name: Format check
        run: cargo fmt --all -- --check

  # ==========================================================================
  # MSRV check
  # ==========================================================================
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2

      - name: Patch path deps for CI
        shell: bash
        run: |
          sed -E \
            -e 's|, path = "\.\./\.\./[^"]*"||g' \
            -e 's|path = "\.\./\.\./[^"]*", ||g' \
            ravif/Cargo.toml > ravif/Cargo.toml.ci && mv ravif/Cargo.toml.ci ravif/Cargo.toml

      - name: Check MSRV
        run: cargo hack check -p zenravif --rust-version ${{ env.PURE_RUST }}

  # ==========================================================================
  # Semver check
  # ==========================================================================
  semver:
    name: Semver Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Patch path deps for CI
        shell: bash
        run: |
          sed -E \
            -e 's|, path = "\.\./\.\./[^"]*"||g' \
            -e 's|path = "\.\./\.\./[^"]*", ||g' \
            ravif/Cargo.toml > ravif/Cargo.toml.ci && mv ravif/Cargo.toml.ci ravif/Cargo.toml

      - name: Check semver
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: zenravif

  # ==========================================================================
  # Code coverage
  # ==========================================================================
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2

      - name: Patch path deps for CI
        shell: bash
        run: |
          sed -E \
            -e 's|, path = "\.\./\.\./[^"]*"||g' \
            -e 's|path = "\.\./\.\./[^"]*", ||g' \
            ravif/Cargo.toml > ravif/Cargo.toml.ci && mv ravif/Cargo.toml.ci ravif/Cargo.toml

      - name: Generate coverage
        run: cargo llvm-cov -p zenravif ${{ env.PURE_RUST }} --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
